<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .primary { fill: #2F3E46; font-family: Arial, Helvetica, sans-serif; font-weight: 600; }
    .secondary { fill: #7A8A8F; font-family: Arial, Helvetica, sans-serif; font-weight: 400; letter-spacing: 3px; }
  </style>

  <!-- Icon -->
  <g transform="translate(20,30)">
    <!-- Roof -->
    <polygon points="0,40 40,5 80,40 70,40 40,15 10,40" fill="#2F3E46"></polygon>
    
    <!-- Circle -->
    <circle cx="40" cy="55" r="25" fill="#2F3E46"></circle>
    
    <!-- Window -->
    <rect x="30" y="45" width="20" height="20" rx="3" fill="#ffffff"></rect>
    <line x1="40" y1="45" x2="40" y2="65" stroke="#2F3E46" stroke-width="2"></line>
    <line x1="30" y1="55" x2="50" y2="55" stroke="#2F3E46" stroke-width="2"></line>
  </g>

  <!-- Text -->
  <text x="120" y="75" class="primary" font-size="48">
    OWN<tspan font-weight="300">PROPERLY</tspan>
  </text>

  <text x="120" y="110" class="secondary" font-size="18">
    PROPERTY MANAGEMENT
  </text>
</svg>