<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>OwnProperly — Property Portfolio Management Software for UK Landlords</title>
    <meta name="description" content="OwnProperly helps UK landlords manage their entire property portfolio in one place. Track rent, compliance, tenants, deals and maintenance — from £2 per property per month." />
    <meta name="keywords" content="property management software UK, landlord software, rent tracker, compliance tracker, HMO management, BTL calculator, tenant portal, property portfolio management" />
    <link rel="canonical" href="https://www.ownproperly.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ownproperly.com/" />
    <meta property="og:title" content="OwnProperly — Property Portfolio Management for UK Landlords" />
    <meta property="og:description" content="Track rent, compliance, tenants and deals across your entire property portfolio. Starts at £2/property/month. 14-day free trial." />
    <meta property="og:image" content="https://www.ownproperly.com/og-image.png" />
    <meta property="og:site_name" content="OwnProperly" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OwnProperly — Property Portfolio Management for UK Landlords" />
    <meta name="twitter:description" content="Track rent, compliance, tenants and deals across your entire property portfolio. From £2/property/month." />
    <meta name="twitter:image" content="https://www.ownproperly.com/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OwnProperly" />
    <meta name="theme-color" content="#2D3C4A" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg"/>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'"/>
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"/></noscript>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OwnProperly",
      "url": "https://www.ownproperly.com",
      "description": "Property portfolio management software for UK landlords. Track rent, compliance, tenants and deals from £2 per property per month.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "2.00",
        "priceCurrency": "GBP",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": "2.00",
          "priceCurrency": "GBP",
          "unitText": "per property per month"
        }
      },
      "featureList": [
        "Rent payment tracking",
        "Compliance certificate management",
        "Tenant portal with branded subdomain",
        "BTL and HMO deal calculator",
        "Right to Rent tracking",
        "Deposit protection tracking",
        "Section 21 and Section 8 notice tracker",
        "AI property listing writer",
        "20 financial reports",
        "GDPR audit log"
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "12"
      }
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OwnProperly",
      "url": "https://www.ownproperly.com",
      "logo": "https://www.ownproperly.com/logo.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@ownproperly.com",
        "contactType": "customer support",
        "areaServed": "GB",
        "availableLanguage": "en"
      },
      "sameAs": []
    }
    </script>

    <!-- Structured Data: WebSite + SiteSearchAction
         Gives Google permission to render a sitelinks search box for the
         brand-name SERP, and lets LLMs understand the site has a search
         interface they can describe to users. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://www.ownproperly.com",
      "name": "OwnProperly",
      "description": "Property portfolio management software for UK landlords",
      "publisher": { "@type": "Organization", "name": "OwnProperly" },
      "inLanguage": "en-GB",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.ownproperly.com/blog/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: FAQPage
         High-value for both Google rich-results AND AI search answer
         boxes (ChatGPT, Perplexity, Gemini, Claude.ai). The questions
         here are the actual questions UK landlords ask — phrased in
         their words — so when someone asks an LLM "what's the best
         landlord software for UK rentals" or "how do I track HMO
         compliance" we surface as a cited answer. Keep answers SHORT
         (under 60 words each) and self-contained. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the best landlord software for UK rental properties?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "OwnProperly is property portfolio management software built specifically for UK landlords. It tracks rent payments, compliance certificates (Gas Safety, EICR, EPC), tenant references and Right to Rent, and includes a BTL deal calculator. Pricing starts at £2 per property per month with a 14-day free trial."
          }
        },
        {
          "@type": "Question",
          "name": "How much does OwnProperly cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "OwnProperly is £2 per property per month on the Starter plan, with no minimum. The Investor plan is £5 per property per month and adds AI portfolio insights, advanced reporting, and priority support. Both plans include a 14-day free trial with no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "Does OwnProperly support Making Tax Digital (MTD) for landlords?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. OwnProperly is built for the MTD ITSA April 2026 mandate. It connects directly to HMRC via gov.uk OAuth, files quarterly Property Business submissions, and includes Section 24 mortgage interest restriction calculations. Sandbox mode lets you practice before going live."
          }
        },
        {
          "@type": "Question",
          "name": "What compliance certificates does OwnProperly track?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "OwnProperly tracks all UK landlord compliance: Gas Safety (CP12), EICR electrical reports, EPC energy performance ratings, HMO licences, Right to Rent expiry, deposit protection (TDS/DPS/MyDeposits), Legionella risk assessments and PAT testing. It sends automatic email reminders before each expiry."
          }
        },
        {
          "@type": "Question",
          "name": "Can multiple landlords share an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. OwnProperly supports multi-user companies with role-based permissions. You can invite a co-owner, accountant, or letting agent with granular controls over what they can view (financials) and edit (properties, tenancies, expenses, compliance)."
          }
        },
        {
          "@type": "Question",
          "name": "Does OwnProperly integrate with Xero or QuickBooks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "OwnProperly has native Xero integration — connect once per company and rent, expenses, mortgage interest, deposits and refurb costs sync automatically. Granular toggles control what syncs. Reconciliation status pulls back from Xero. QuickBooks support is on the roadmap."
          }
        },
        {
          "@type": "Question",
          "name": "Is OwnProperly suitable for HMO landlords?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. OwnProperly handles HMOs with per-room rent tracking, individual tenant references, HMO licence expiry alerts, and the ability to bulk-add a block of units in one step. Both selective licensing and mandatory HMO licensing are supported."
          }
        },
        {
          "@type": "Question",
          "name": "Can tenants access OwnProperly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Each property has a branded tenant portal where tenants can see their tenancy details, payment history, request repairs with photos, and download shared documents (gas safety certificates, the How to Rent guide). The portal lives at your-company.ownproperly.com."
          }
        }
      ]
    }
    </script>

    <!-- Structured Data: BreadcrumbList for the landing page -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://www.ownproperly.com/"
        }
      ]
    }
    </script>

    <style>
      html, body, #root { width: 100%; max-width: 100%; overflow-x: hidden; margin: 0; padding: 0; background: #F4F3EF; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
      })
    }
    </script>
  </body>
</html>
