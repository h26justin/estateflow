    <!-- Structured Data: WebSite + SiteSearchAction
         Gives Google permission to render a sitelinks search box for the

         interface they can describe to users. -->
    <script type="application/ld+json">

      "name": "Properly",

      "potentialAction": {

        "query-input": "required name=search_term_string"
      }
    }

    <!-- Structured Data: FAQPage
         High-value for both Google rich-results AND AI search answer
         boxes (ChatGPT, Perplexity, Gemini, Claude.ai). The questions
         here are the actual questions UK landlords ask — phrased in
         their words — so when someone asks an LLM "what's the best
         landlord software for UK rentals" or "how do I track HMO
         compliance" we surface as a cited answer. Keep answers SHORT
         (under 60 words each) and self-contained. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the best landlord software for UK rental properties?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Properly is property portfolio management software built specifically for UK landlords. It tracks rent payments, compliance certificates (Gas Safety, EICR, EPC), tenant references and Right to Rent, and includes a BTL deal calculator. Pricing starts at £2 per property per month (£10/month minimum) with a 14-day free trial."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Properly cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Properly is £2 per property per month on the Starter plan. The Investor plan is £5 per property per month and adds AI portfolio insights, the AI listing writer and the deals pipeline. Both plans have a £10/month minimum and include a 14-day free trial with no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "Does Properly support Making Tax Digital (MTD) for landlords?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Properly is built for the MTD ITSA April 2026 mandate. It connects directly to HMRC via gov.uk OAuth, files quarterly Property Business submissions, and includes Section 24 mortgage interest restriction calculations. Sandbox mode lets you practice before going live."
          }
        },
        {
          "@type": "Question",
          "name": "What compliance certificates does Properly track?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Properly tracks all UK landlord compliance: Gas Safety (CP12), EICR electrical reports, EPC energy performance ratings, HMO licences, Right to Rent expiry, deposit protection (TDS/DPS/MyDeposits), Legionella risk assessments and PAT testing. It sends automatic email reminders before each expiry."
          }
        },
        {
          "@type": "Question",
          "name": "Can multiple landlords share an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Properly supports multi-user companies with role-based permissions. You can invite a co-owner, accountant, or letting agent with granular controls over what they can view (financials) and edit (properties, tenancies, expenses, compliance)."
          }
        },
        {
          "@type": "Question",
          "name": "Does Properly integrate with Xero or QuickBooks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Properly has native Xero integration — connect once per company and rent, expenses, mortgage interest, deposits and refurb costs sync automatically. Granular toggles control what syncs. Reconciliation status pulls back from Xero. QuickBooks support is on the roadmap."
          }
        },
        {
          "@type": "Question",
          "name": "Is Properly suitable for HMO landlords?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Properly handles HMOs with per-room rent tracking, individual tenant references, HMO licence expiry alerts, and the ability to bulk-add a block of units in one step. Both selective licensing and mandatory HMO licensing are supported."
          }
        },
        {
          "@type": "Question",
          "name": "Can tenants access Properly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Each property has a branded tenant portal where tenants can see their tenancy details, payment history, request repairs with photos, and download shared documents (gas safety certificates, the How to Rent guide). The portal lives at your-company.ownproperly.com."
          }
        }
      ]
    }
    </script>

    <!-- ────────────────────────────────────────────────────────────────
         Analytics — gated by cookie consent (GDPR / PECR compliance).
         We use a "consent mode v2" pattern: GA4 + Meta Pixel are loaded
         but set to denied-by-default. Plausible loads unconditionally
         because it's cookieless and exempted under PECR (no banner needed
         for it specifically — banner is for the other two).

         To go live: replace the three placeholder IDs below.
           GA4_MEASUREMENT_ID = G-XXXXXXXXXX        (from Google Analytics)
           META_PIXEL_ID      = 0000000000000000    (from Meta Events Manager)
           GTM_CONTAINER_ID   = GTM-XXXXXXX         (optional — only if using GTM)
    ──────────────────────────────────────────────────────────────── -->

    <!-- Plausible Analytics — cookieless, privacy-friendly, no banner needed.
         Loads on every page. Aggregate visit data only — no PII. -->
    <script defer data-domain="ownproperly.com"
            src="https://plausible.io/js/script.outbound-links.js"></script>

    <!-- Google consent mode v2 — default-deny everything until the user
         accepts. The cookie banner below flips these to 'granted' on
         accept and persists the choice in localStorage. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'granted',
        'security_storage': 'granted',
        'wait_for_update': 500,
      });
      // Honour any prior consent from localStorage so returning visitors
      // don't see the banner again.
      try {
        var prior = JSON.parse(localStorage.getItem('op_cookie_consent') || 'null');
        if (prior && prior.v === 1 && prior.choice === 'accept') {
          gtag('consent', 'update', {
            'ad_storage': 'granted', 'ad_user_data': 'granted',
            'ad_personalization': 'granted', 'analytics_storage': 'granted',
          });
        }
      } catch (e) {}
    </script>

      height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript> -->

    <div id="root"></div>

    <!-- Cookie consent banner — rendered inline (not via React) so it
         appears immediately on first paint and works even if JS bundle
         fails to load. Gated by localStorage so returning visitors aren't
         re-prompted. ICO/PECR-compliant: explicit reject is just as easy
         as accept; analytics/ads do not fire until accept. -->
    <script>
    (function() {
      try {
        var prior = JSON.parse(localStorage.getItem('op_cookie_consent') || 'null');
        if (prior && prior.v === 1) return; // already decided
      } catch (e) {}

      function persist(choice) {
        try { localStorage.setItem('op_cookie_consent', JSON.stringify({ v:1, choice: choice, at: Date.now() })); } catch (e) {}
        var b = document.getElementById('op-cookie-banner');
        if (b) b.remove();
      }

      function accept() {
        persist('accept');
        if (typeof gtag === 'function') {
          gtag('consent', 'update', {
            'ad_storage': 'granted', 'ad_user_data': 'granted',
            'ad_personalization': 'granted', 'analytics_storage': 'granted',
          });
        }
        if (typeof fbq === 'function') { fbq('consent', 'grant'); }
      }

      function reject() {
        persist('reject');
        // gtag default is already 'denied' — nothing else to do.
      }

      function render() {
        var banner = document.createElement('div');
        banner.id = 'op-cookie-banner';
        banner.setAttribute('role', 'dialog');
        banner.setAttribute('aria-label', 'Cookie consent');
        banner.innerHTML =
          '<p>We use cookies to understand how visitors use Properly and to measure our advertising. ' +
          'Analytics and ads use cookies; essential cookies (sign-in session) always work. ' +
          '<a href="/privacy" target="_blank" rel="noopener">Read our privacy policy</a>.</p>' +
          '<div class="op-cookie-actions">' +
          '  <button class="op-cookie-reject" type="button">Reject non-essential</button>' +
          '  <button class="op-cookie-accept" type="button">Accept all</button>' +
          '</div>';
        document.body.appendChild(banner);
        banner.querySelector('.op-cookie-accept').addEventListener('click', accept);
        banner.querySelector('.op-cookie-reject').addEventListener('click', reject);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', render);
      } else {
        render();
      }
    })();
    </script>
